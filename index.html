<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFound — Student Lost & Found Network</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12 antialiased selection:bg-indigo-600 selection:text-white">

    <!-- Top Navigation Bar -->
    <header class="border-b border-slate-800/80 bg-slate-950/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-4 py-3.5 flex justify-between items-center">
            <div class="flex items-center gap-2.5">
                <div class="h-9 w-9 rounded-xl bg-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-600/30">
                    <i class="fa-solid fa-compass text-white text-base"></i>
                </div>
                <div>
                    <h1 class="text-base font-extrabold tracking-tight">Campus<span class="text-indigo-400">Found</span></h1>
                    <p class="text-[10px] text-slate-400 font-medium">Campus Recovery Network</p>
                </div>
            </div>
            
            <button onclick="toggleForm()" id="toggleFormBtn" class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white text-xs font-semibold px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 shadow-md shadow-indigo-600/20">
                <i class="fa-solid fa-plus text-[11px]"></i> Post Item
            </button>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-5 space-y-5">
        
        <!-- Collapsible Report Section -->
        <section id="form-container" class="hidden transition-all duration-300">
            <div class="bg-slate-900/90 border border-slate-800 p-5 rounded-2xl shadow-xl space-y-4">
                <div class="flex justify-between items-center pb-2 border-b border-slate-800/60">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center gap-2">
                        <i class="fa-solid fa-bullhorn text-indigo-400"></i> Submit a Report
                    </h2>
                    <button onclick="toggleForm()" class="text-xs text-slate-500 hover:text-slate-300"><i class="fa-solid fa-xmark"></i></button>
                </div>

                <form id="itemForm" class="space-y-3.5">
                    <!-- Lost vs Found selector -->
                    <div class="grid grid-cols-2 gap-2">
                        <label class="cursor-pointer">
                            <input type="radio" name="itemType" value="Lost" checked class="peer sr-only">
                            <div class="text-center py-2 rounded-xl border border-slate-700/80 bg-slate-800/60 peer-checked:bg-rose-500/20 peer-checked:border-rose-500 peer-checked:text-rose-400 text-xs font-bold transition flex items-center justify-center gap-1.5">
                                <span class="h-2 w-2 rounded-full bg-rose-500"></span> Lost Something
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="itemType" value="Found" class="peer sr-only">
                            <div class="text-center py-2 rounded-xl border border-slate-700/80 bg-slate-800/60 peer-checked:bg-emerald-500/20 peer-checked:border-emerald-500 peer-checked:text-emerald-400 text-xs font-bold transition flex items-center justify-center gap-1.5">
                                <span class="h-2 w-2 rounded-full bg-emerald-500"></span> Found Something
                            </div>
                        </label>
                    </div>

                    <!-- Title & Category -->
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                        <div class="sm:col-span-2">
                            <input type="text" id="itemTitle" placeholder="Item Name (e.g., Casio fx-991EX, Blue Umbrella)" required 
                                   class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
                        </div>
                        <div>
                            <select id="itemCategory" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 transition">
                                <option value="Electronics">📱 Electronics</option>
                                <option value="ID Card / Documents">🪪 ID / Documents</option>
                                <option value="Books / Notes">📚 Books / Notes</option>
                                <option value="Keys / Wallet">🔑 Keys / Wallet</option>
                                <option value="Accessories">🎒 Accessories</option>
                                <option value="Other">📦 Other</option>
                            </select>
                        </div>
                    </div>

                    <!-- Location & WhatsApp -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <div class="relative">
                            <i class="fa-solid fa-location-dot absolute left-3 top-3 text-slate-500 text-xs"></i>
                            <input type="text" id="itemLocation" placeholder="Location (e.g. CS Lab 2, Canteen)" required 
                                   class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-8 pr-3 py-2.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
                        </div>
                        <div class="relative">
                            <i class="fa-brands fa-whatsapp absolute left-3 top-3 text-emerald-500 text-xs"></i>
                            <input type="tel" id="itemContact" placeholder="WhatsApp Number (10 digits)" required 
                                   class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-8 pr-3 py-2.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
                        </div>
                    </div>

                    <!-- Details -->
                    <textarea id="itemDesc" rows="2" placeholder="Specific identifiers (e.g., black cover, scratch on screen, stickers...)" 
                              class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition resize-none"></textarea>

                    <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white font-semibold py-2.5 rounded-xl text-xs transition shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Publish Item to Campus Feed
                    </button>
                </form>
            </div>
        </section>

        <!-- Search & Category Filters -->
        <section class="space-y-3">
            <!-- Search Bar -->
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-500 text-xs"></i>
                <input type="text" id="searchInput" oninput="applyFilters()" placeholder="Search by item name, location, or keyword..." 
                       class="w-full bg-slate-900/80 border border-slate-800/80 rounded-2xl pl-9 pr-4 py-2.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition shadow-sm">
            </div>

            <!-- Tab Switcher -->
            <div class="flex items-center justify-between gap-2 overflow-x-auto pb-1 no-scrollbar">
                <div class="flex gap-1.5 bg-slate-900/80 border border-slate-800 p-1 rounded-xl">
                    <button onclick="setTab('all')" id="tab-all" class="tab-btn active px-3 py-1 rounded-lg text-xs font-semibold bg-indigo-600 text-white transition">All Items</button>
                    <button onclick="setTab('Lost')" id="tab-Lost" class="tab-btn px-3 py-1 rounded-lg text-xs font-semibold text-slate-400 hover:text-slate-200 transition">🔴 Lost</button>
                    <button onclick="setTab('Found')" id="tab-Found" class="tab-btn px-3 py-1 rounded-lg text-xs font-semibold text-slate-400 hover:text-slate-200 transition">🟢 Found</button>
                </div>
                <button onclick="fetchItems()" class="text-xs text-slate-400 hover:text-indigo-400 px-2.5 py-1 rounded-lg border border-slate-800/60 bg-slate-900/50 flex items-center gap-1 shrink-0 transition">
                    <i class="fa-solid fa-rotate-right text-[11px]"></i> Refresh
                </button>
            </div>
        </section>

        <!-- Live Feed Container -->
        <section class="space-y-3">
            <div id="feedList" class="space-y-3">
                <div class="text-center py-12 text-xs text-slate-500">Connecting to cloud database...</div>
            </div>
        </section>

    </main>

    <script>
        const API_URL = "https://tiwrylrecmjwuprhuqyj.supabase.co/rest/v1/campus_items";
        const API_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpd3J5bHJlY21qd3Vwcmh1cXlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4MDU5MjMsImV4cCI6MjEwMzM4MTkyM30.keuLkhmJzS5Vm6IrpX8D1iDG2rWtW3euOCbo579qULo";

        const headers = {
            "apikey": API_KEY,
            "Authorization": "Bearer " + API_KEY,
            "Content-Type": "application/json",
            "Prefer": "return=representation"
        };

        let rawItems = [];
        let activeTab = 'all';

        const feedList = document.getElementById('feedList');
        const submitBtn = document.getElementById('submitBtn');

        function toggleForm() {
            const form = document.getElementById('form-container');
            const btn = document.getElementById('toggleFormBtn');
            form.classList.toggle('hidden');
            if (!form.classList.contains('hidden')) {
                form.scrollIntoView({ behavior: 'smooth' });
                btn.innerHTML = `<i class="fa-solid fa-chevron-up text-[11px]"></i> Close`;
            } else {
                btn.innerHTML = `<i class="fa-solid fa-plus text-[11px]"></i> Post Item`;
            }
        }

        function setTab(tab) {
            activeTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = 'tab-btn px-3 py-1 rounded-lg text-xs font-semibold text-slate-400 hover:text-slate-200 transition';
            });
            const activeBtn = document.getElementById(`tab-${tab}`);
            activeBtn.className = 'tab-btn px-3 py-1 rounded-lg text-xs font-semibold bg-indigo-600 text-white transition';
            applyFilters();
        }

        async function fetchItems() {
            try {
                const res = await fetch(`${API_URL}?select=*&order=id.desc`, { headers });
                if (!res.ok) {
                    feedList.innerHTML = `<div class="p-4 bg-red-900/20 border border-red-800/40 rounded-xl text-center text-xs text-red-400">Failed to fetch live data. Check database permissions.</div>`;
                    return;
                }

                rawItems = await res.json();
                applyFilters();
            } catch (err) {
                feedList.innerHTML = `<div class="p-4 bg-red-900/20 border border-red-800/40 rounded-xl text-center text-xs text-red-400">Network connection issue.</div>`;
            }
        }

        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            
            let filtered = rawItems.filter(item => {
                const matchesTab = (activeTab === 'all') || (item.item_type === activeTab);
                const titleMatch = item.title?.toLowerCase().includes(query) || false;
                const locMatch = item.location?.toLowerCase().includes(query) || false;
                const descMatch = item.description?.toLowerCase().includes(query) || false;
                return matchesTab && (titleMatch || locMatch || descMatch);
            });

            renderFeed(filtered);
        }

        function renderFeed(items) {
            if (!items || items.length === 0) {
                feedList.innerHTML = `
                    <div class="text-center py-14 bg-slate-900/40 border border-slate-800/60 rounded-2xl space-y-2">
                        <i class="fa-regular fa-folder-open text-2xl text-slate-600"></i>
                        <p class="text-xs text-slate-400 font-medium">No records match your view.</p>
                    </div>`;
                return;
            }

            feedList.innerHTML = items.map(item => {
                const isLost = item.item_type === 'Lost';
                const formattedDate = item.created_at ? new Date(item.created_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : 'Recently';

                return `
                <div class="bg-slate-900/80 border border-slate-800 hover:border-slate-700 p-4 rounded-2xl transition duration-200 shadow-sm space-y-3">
                    <div class="flex items-start justify-between gap-3">
                        <div class="space-y-1">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="text-[10px] font-extrabold px-2.5 py-0.5 rounded-md tracking-wider uppercase ${isLost ? 'bg-rose-500/10 text-rose-400 border border-rose-500/20' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'}">
                                    ${item.item_type}
                                </span>
                                <span class="text-[11px] text-slate-400 flex items-center gap-1"><i class="fa-regular fa-clock text-[10px]"></i> ${formattedDate}</span>
                            </div>
                            <h3 class="text-sm font-bold text-slate-100">${escapeHTML(item.title)}</h3>
                        </div>

                        <div class="flex items-center gap-2 shrink-0">
                            <a href="https://wa.me/91${item.contact.replace(/[^0-9]/g, '')}" target="_blank" 
                               class="bg-emerald-600/15 hover:bg-emerald-600/25 text-emerald-400 border border-emerald-500/30 text-xs px-3 py-1.5 rounded-xl font-semibold flex items-center gap-1.5 transition">
                                <i class="fa-brands fa-whatsapp text-emerald-400"></i> Chat
                            </a>
                            <button onclick="deleteItem(${item.id})" class="text-slate-500 hover:text-rose-400 p-1.5 rounded-lg transition" title="Delete">
                                <i class="fa-regular fa-trash-can text-xs"></i>
                            </button>
                        </div>
                    </div>

                    <p class="text-xs text-slate-300 leading-relaxed font-light">${escapeHTML(item.description || 'No additional details provided.')}</p>

                    <div class="pt-2 border-t border-slate-800/60 flex items-center justify-between text-[11px] text-slate-400">
                        <span class="flex items-center gap-1.5">
                            <i class="fa-solid fa-location-dot text-indigo-400 text-xs"></i>
                            <span class="font-medium text-slate-300">${escapeHTML(item.location)}</span>
                        </span>
                        <span class="text-slate-500 flex items-center gap-1">
                            <i class="fa-solid fa-phone text-[10px]"></i> ${escapeHTML(item.contact)}
                        </span>
                    </div>
                </div>`;
            }).join('');
        }

        async function deleteItem(id) {
            if (confirm("Are you sure you want to resolve/remove this entry?")) {
                await fetch(`${API_URL}?id=eq.${id}`, { method: 'DELETE', headers });
                fetchItems();
            }
        }

        document.getElementById('itemForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Publishing...`;

            const newItem = {
                item_type: document.querySelector('input[name="itemType"]:checked').value,
                title: document.getElementById('itemTitle').value,
                location: document.getElementById('itemLocation').value,
                contact: document.getElementById('itemContact').value,
                description: `[${document.getElementById('itemCategory').value}] ${document.getElementById('itemDesc').value}`
            };

            const res = await fetch(API_URL, {
                method: 'POST',
                headers,
                body: JSON.stringify(newItem)
            });

            if (!res.ok) {
                const err = await res.json();
                alert("Submission failed: " + (err.message || 'Error'));
            } else {
                document.getElementById('itemForm').reset();
                toggleForm();
                fetchItems();
            }

            submitBtn.disabled = false;
            submitBtn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Publish Item to Campus Feed`;
        });

        function escapeHTML(str) {
            return str ? String(str).replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)) : '';
        }

        fetchItems();
    </script>
</body>
</html>
