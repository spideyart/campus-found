<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Lost & Found Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-compass text-indigo-500 text-xl"></i>
                <h1 class="text-lg font-bold">Campus<span class="text-indigo-400">Found</span></h1>
            </div>
            <a href="#form-section" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition">+ Report</a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6 space-y-6">
        
        <!-- Post Form -->
        <section id="form-section" class="bg-slate-800 border border-slate-700 p-5 rounded-xl shadow-lg">
            <h2 class="text-sm font-bold uppercase tracking-wider text-slate-300 mb-3">Report Lost / Found Item</h2>
            <form id="itemForm" class="space-y-3">
                <div class="grid grid-cols-2 gap-2">
                    <label class="cursor-pointer text-center">
                        <input type="radio" name="itemType" value="Lost" checked class="peer sr-only">
                        <div class="py-1.5 rounded-lg border border-slate-600 bg-slate-700/50 peer-checked:bg-red-500/20 peer-checked:border-red-500 peer-checked:text-red-400 text-xs font-bold transition">🔴 Lost</div>
                    </label>
                    <label class="cursor-pointer text-center">
                        <input type="radio" name="itemType" value="Found" class="peer sr-only">
                        <div class="py-1.5 rounded-lg border border-slate-600 bg-slate-700/50 peer-checked:bg-emerald-500/20 peer-checked:border-emerald-500 peer-checked:text-emerald-400 text-xs font-bold transition">🟢 Found</div>
                    </label>
                </div>
                <input type="text" id="itemTitle" placeholder="Item Name (e.g. Casio fx-991EX)" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-indigo-500 text-slate-100">
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="itemLocation" placeholder="Location (e.g. CS Lab 2)" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-indigo-500 text-slate-100">
                    <input type="text" id="itemContact" placeholder="WhatsApp Number" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-indigo-500 text-slate-100">
                </div>
                <textarea id="itemDesc" rows="2" placeholder="Details (color, scratches...)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-indigo-500 text-slate-100"></textarea>
                <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2 rounded-lg text-xs transition">Post Item to Cloud</button>
            </form>
        </section>

        <!-- Live Feed -->
        <section class="space-y-3">
            <div class="flex justify-between items-center">
                <h2 class="text-sm font-bold text-slate-300">Live Campus Feed (Shared Globally)</h2>
                <button onclick="fetchItems()" class="text-xs text-indigo-400 hover:text-indigo-300 flex items-center gap-1">
                    <i class="fa-solid fa-rotate-right"></i> Refresh
                </button>
            </div>
            <div id="feedList" class="space-y-3">
                <div class="text-center py-8 text-xs text-slate-500">Connecting to cloud database...</div>
            </div>
        </section>

    </main>

    <script>
        const API_URL = "https://tiwrylrecmjwuprhuqyj.supabase.co/rest/v1/campus_items";
        const API_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpd3J5bHJlY21qd3Vwcmh1cXlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4MDU5MjMsImV4cCI6MjEwMzM4MTkyM30.keuLkhmJzS5Vm6IrpX8D1iDG2rWtW3euOCbo579qULo";

        const headers = {
            "apikey": API_KEY,
            "Authorization": "Bearer " + API_KEY,
            "Content-Type": "application/json",
            "Prefer": "return=representation"
        };

        const feedList = document.getElementById('feedList');
        const submitBtn = document.getElementById('submitBtn');

        async function fetchItems() {
            try {
                const res = await fetch(`${API_URL}?select=*&order=id.desc`, { headers });
                
                if (!res.ok) {
                    const err = await res.json();
                    feedList.innerHTML = `<div class="p-3 bg-red-900/30 border border-red-700/50 rounded-lg text-center text-xs text-red-300">Error: ${err.message || 'Failed to fetch'}</div>`;
                    return;
                }

                const data = await res.json();

                if (!data || data.length === 0) {
                    feedList.innerHTML = `<div class="text-center py-10 bg-slate-800/40 border border-slate-800 rounded-xl text-xs text-slate-400">No items posted yet. Be the first to report!</div>`;
                    return;
                }

                feedList.innerHTML = data.map(item => `
                    <div class="bg-slate-800/80 border border-slate-700 p-4 rounded-xl flex justify-between items-center gap-3">
                        <div class="space-y-1">
                            <div class="flex items-center gap-2">
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${item.item_type === 'Lost' ? 'bg-red-500/20 text-red-400 border border-red-500/30' : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'}">${escapeHTML(item.item_type)}</span>
                                <h3 class="text-sm font-bold text-slate-100">${escapeHTML(item.title)}</h3>
                            </div>
                            <p class="text-xs text-slate-400">${escapeHTML(item.description || 'No extra details.')}</p>
                            <p class="text-[11px] text-slate-500"><i class="fa-solid fa-location-dot text-indigo-400 mr-1"></i>${escapeHTML(item.location)}</p>
                        </div>
                        
                        <div class="flex flex-col items-end gap-2 shrink-0">
                            <a href="https://wa.me/91${item.contact.replace(/[^0-9]/g, '')}" target="_blank" class="bg-emerald-600/20 text-emerald-300 border border-emerald-500/40 text-xs px-3 py-1.5 rounded-lg flex items-center gap-1 hover:bg-emerald-600/30 transition">
                                <i class="fa-brands fa-whatsapp"></i> Chat
                            </a>
                            <button onclick="deleteItem(${item.id})" class="text-[11px] text-red-400 hover:text-red-300 flex items-center gap-1 transition">
                                <i class="fa-regular fa-trash-can"></i> Remove
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                feedList.innerHTML = `<p class="text-xs text-red-400 text-center py-4">Network error: ${err.message}</p>`;
            }
        }

        async function deleteItem(id) {
            if (confirm("Are you sure you want to remove this item?")) {
                await fetch(`${API_URL}?id=eq.${id}`, {
                    method: 'DELETE',
                    headers
                });
                fetchItems();
            }
        }

        document.getElementById('itemForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerText = "Posting...";

            const newItem = {
                item_type: document.querySelector('input[name="itemType"]:checked').value,
                title: document.getElementById('itemTitle').value,
                location: document.getElementById('itemLocation').value,
                contact: document.getElementById('itemContact').value,
                description: document.getElementById('itemDesc').value
            };

            const res = await fetch(API_URL, {
                method: 'POST',
                headers,
                body: JSON.stringify(newItem)
            });

            if (!res.ok) {
                const err = await res.json();
                alert("Failed to post: " + (err.message || 'Error occurred'));
            } else {
                document.getElementById('itemForm').reset();
                fetchItems();
            }

            submitBtn.disabled = false;
            submitBtn.innerText = "Post Item to Cloud";
        });

        function escapeHTML(str) {
            return str ? String(str).replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)) : '';
        }

        fetchItems();
    </script>
</body>
</html>
